<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,500;1,6..72,600&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F9F8F6;color:#0F1B2D;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}h1,h2,h3,h4,h5,h6{font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:-0.035em}a{color:#9A7A34}a:hover{color:#6E5323}button{font-family:inherit}</style>
<script src="image-slot.js"></script>
<script src="data.js"></script>
</helmet>
<div style="min-height:100vh;background:#F9F8F6">
  <dc-import name="SiteNav" active="" style="position:sticky;top:0;z-index:50" hint-size="100%,72px"></dc-import>
  <div data-role="page-banner" style="max-width:1240px;margin:16px auto 0;padding:0 24px"><div style="height:clamp(160px,24vw,280px);border-radius:28px;overflow:hidden"><dc-import name="AivanaVisual" photo="map" bare="{{ true }}" w="2000" style="width:100%;height:100%" hint-size="100%,100%"></dc-import></div></div>
  <div data-screen-label="Tarifs" style="max-width:960px;margin:0 auto;padding:64px 24px 96px;display:flex;flex-direction:column;gap:48px">
    <div style="display:flex;flex-direction:column;gap:12px;align-items:flex-start">
      <h1 style="margin:0;font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:-0.035em;font-size:clamp(36px,4.6vw,56px);line-height:1.05">Des tarifs <em style="font-family:'Newsreader',serif;font-style:italic;font-weight:500;letter-spacing:-0.02em">simples</em></h1>
      <p style="margin:0;font-size:17px;color:#4D4943">Gratuit pour commencer. Sans engagement, sans carte bancaire.</p>
      <div style="display:flex;gap:4px;background:#FFFDF9;border:1px solid #E4DFD5;border-radius:999px;padding:3px;margin-top:8px">
        <sc-for list="{{ periods }}" as="p" hint-placeholder-count="2">
          <button onClick="{{ p.pick }}" style="cursor:pointer;border:none;font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;background:{{ p.bg }};color:{{ p.fg }}">{{ p.label }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px">
      <div style="border:1px solid #E4DFD5;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:24px">
        <div style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:16px;font-weight:600">Gratuit</span>
          <span style="display:flex;align-items:baseline;gap:6px"><span style="font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:-0.035em;font-size:48px">0 €</span><span style="font-size:14px;color:#736E66">pour toujours</span></span>
        </div>
        <div style="display:flex;flex-direction:column;border-top:1px solid #E4DFD5">
          <sc-for list="{{ free }}" as="f" hint-placeholder-count="4"><div style="display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #E4DFD5;font-size:14px;color:#4D4943"><span style="color:#736E66">✓</span><span>{{ f }}</span></div></sc-for>
        </div>
        <a href="Connexion.dc.html" style="margin-top:auto;text-align:center;font-size:14px;font-weight:600;color:#0F1B2D;border:1px solid #D3CCBF;text-decoration:none;padding:12px 16px;border-radius:999px" style-hover="border-color:#736E66;color:#0F1B2D">Créer un compte</a>
      </div>
      <div style="border:1px solid #9A7A34;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:24px;background:#FFFDF9">
        <div style="display:flex;flex-direction:column;gap:6px">
          <span style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:16px;font-weight:600;color:#9A7A34">Pro</span><span style="font-size:12px;color:#4D4943">{{ saving }}</span></span>
          <span style="display:flex;align-items:baseline;gap:6px"><span style="font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:-0.035em;font-size:48px">{{ price }}</span><span style="font-size:14px;color:#736E66">{{ per }}</span></span>
        </div>
        <div style="display:flex;flex-direction:column;border-top:1px solid #E4DFD5">
          <sc-for list="{{ pro }}" as="f" hint-placeholder-count="6"><div style="display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #E4DFD5;font-size:14px"><span style="color:#9A7A34">✓</span><span>{{ f }}</span></div></sc-for>
        </div>
        <a href="Connexion.dc.html" style="margin-top:auto;text-align:center;font-size:14px;font-weight:600;color:#F9F8F6;background:#0F1B2D;text-decoration:none;padding:12px 16px;border-radius:999px" style-hover="background:#1E2E47;color:#F9F8F6">Passer à Pro</a>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <h2 style="margin:0;font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:-0.035em;font-size:28px">Comparer en détail</h2>
      <div style="overflow-x:auto">
        <div style="min-width:480px;display:flex;flex-direction:column">
          <div style="display:grid;grid-template-columns:2fr 1fr 1fr;padding:12px 0;border-bottom:1px solid #D3CCBF;font-size:13px;color:#736E66"><span></span><span>Gratuit</span><span>Pro</span></div>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
            <div style="display:grid;grid-template-columns:2fr 1fr 1fr;padding:13px 0;border-bottom:1px solid #E4DFD5;font-size:14px"><span>{{ r.f }}</span><span style="color:#4D4943">{{ r.a }}</span><span>{{ r.b }}</span></div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
  <dc-import name="SiteFooter" hint-size="100%,560px"></dc-import>
  <dc-import name="ChatDock" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { yearly: false };
  renderVals() {
    const y = this.state.yearly;
    const tab = on => ({ bg: on ? "#0F1B2D" : "transparent", fg: on ? "#F9F8F6" : "#4D4943" });
    return {
      periods: [{ label: "Mensuel", ...tab(!y), pick: () => this.setState({ yearly: false }) }, { label: "Annuel", ...tab(y), pick: () => this.setState({ yearly: true }) }],
      price: y ? "99 €" : "9,99 €", per: y ? "par an" : "par mois", saving: y ? "2 mois offerts" : "",
      free: ["5 recherches avec l'assistant par mois", "Toutes les destinations et filtres", "2 voyages sauvegardés", "Itinéraire et suivi du budget"],
      pro: ["Assistant illimité", "Voyages illimités", "Export PDF de l'itinéraire", "Alertes de prix sur vos vols", "Import Gmail et Outlook (bientôt)", "Support prioritaire"],
      rows: [
        { f: "Recherches avec l'assistant", a: "5 / mois", b: "Illimitées" },
        { f: "Voyages sauvegardés", a: "2", b: "Illimités" },
        { f: "Prix vols et hôtels en direct", a: "✓", b: "✓" },
        { f: "Itinéraire et budget", a: "✓", b: "✓" },
        { f: "Export PDF", a: "—", b: "✓" },
        { f: "Alertes de prix", a: "—", b: "✓" },
        { f: "Support", a: "Email", b: "Prioritaire" },
      ],
    };
  }
}
</script>
</body>
</html>
