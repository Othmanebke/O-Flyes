<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,500;1,6..72,600&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F9F8F6;color:#0F1B2D;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#9A7A34}a:hover{color:#6E5323}input,button{font-family:inherit}::placeholder{color:#736E66}h1,h2,h3,h4,h5,h6{font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:-0.035em}</style>
<script src="image-slot.js"></script>
<script src="data.js"></script>
</helmet>
<div style="min-height:100vh;background:#F9F8F6">
  <dc-import name="SiteNav" active="vols" style="position:sticky;top:0;z-index:50" hint-size="100%,72px"></dc-import>
  <div data-role="page-banner" style="max-width:1240px;margin:16px auto 0;padding:0 24px"><div style="height:clamp(160px,24vw,280px);border-radius:28px;overflow:hidden"><dc-import name="AivanaVisual" photo="clouds" bare="{{ true }}" w="2000" style="width:100%;height:100%" hint-size="100%,100%"></dc-import></div></div>
  <div data-screen-label="Vols" style="max-width:1200px;margin:0 auto;padding:48px 24px 96px;display:flex;flex-direction:column;gap:28px">
    <h1 style="margin:0;font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:-0.035em;font-size:clamp(36px,4.6vw,56px);line-height:1.05">Trouver <em style="font-family:'Newsreader',serif;font-style:italic;font-weight:500;letter-spacing:-0.02em">votre vol</em></h1>

    <form onSubmit="{{ search }}" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:#D3CCBF;border:1px solid #D3CCBF;border-radius:22px;overflow:hidden">
      <sc-for list="{{ fields }}" as="f" hint-placeholder-count="5">
        <label style="background:#FFFDF9;padding:10px 14px;display:flex;flex-direction:column;gap:2px">
          <span style="font-size:12px;color:#736E66">{{ f.label }}</span>
          <input value="{{ f.value }}" onChange="{{ f.set }}" style="background:transparent;border:none;outline:none;color:#0F1B2D;font-size:15px;padding:0;height:24px;min-width:0">
        </label>
      </sc-for>
      <button type="submit" style="grid-column:1/-1;cursor:pointer;border:none;background:#0F1B2D;color:#F9F8F6;font-weight:600;font-size:15px;min-height:52px" style-hover="background:#1E2E47">Rechercher</button>
    </form>

    <div style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
      <aside style="flex:0 1 220px;min-width:200px;display:flex;flex-direction:column;gap:24px">
        <div style="display:flex;flex-direction:column;gap:10px">
          <span style="font-size:14px;font-weight:600">Escales</span>
          <sc-for list="{{ stopOpts }}" as="o" hint-placeholder-count="3">
            <button onClick="{{ o.pick }}" style="cursor:pointer;display:flex;align-items:center;gap:10px;background:transparent;border:none;color:#4D4943;font-size:14px;padding:2px 0;text-align:left">
              <span style="width:16px;height:16px;border-radius:50%;border:1.5px solid {{ o.ring }};display:flex;align-items:center;justify-content:center"><span style="width:8px;height:8px;border-radius:50%;background:{{ o.dot }}"></span></span>{{ o.label }}
            </button>
          </sc-for>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <span style="font-size:14px;font-weight:600">Compagnies</span>
          <sc-for list="{{ airlines }}" as="o" hint-placeholder-count="4">
            <button onClick="{{ o.toggle }}" style="cursor:pointer;display:flex;align-items:center;gap:10px;background:transparent;border:none;color:#4D4943;font-size:14px;padding:2px 0;text-align:left">
              <span style="width:16px;height:16px;border-radius:999px;border:1.5px solid {{ o.ring }};background:{{ o.fill }};color:#F9F8F6;font-size:11px;line-height:13px;text-align:center">{{ o.check }}</span>{{ o.label }}
            </button>
          </sc-for>
        </div>
      </aside>

      <div style="flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px">
          <span style="font-size:14px;color:#4D4943">{{ summary }}</span>
          <div style="display:flex;gap:4px;background:#FFFDF9;border:1px solid #E4DFD5;border-radius:999px;padding:3px">
            <sc-for list="{{ sorts }}" as="s" hint-placeholder-count="3">
              <button onClick="{{ s.pick }}" style="cursor:pointer;white-space:nowrap;border:none;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;background:{{ s.bg }};color:{{ s.fg }}">{{ s.label }}</button>
            </sc-for>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;border-top:1px solid #E4DFD5">
          <sc-for list="{{ results }}" as="r" hint-placeholder-count="6">
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px 20px;align-items:center;padding:18px 0;border-bottom:1px solid #E4DFD5">
              <div style="display:flex;flex-direction:column;gap:3px">
                <span style="font-size:15px;font-weight:600">{{ r.airline }}</span>
                <span style="font-size:13px;color:#736E66">{{ r.number }}</span>
              </div>
              <div style="display:flex;align-items:center;gap:10px;font-family:'Manrope',sans-serif;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px">
                <span style="display:flex;flex-direction:column"><span>{{ r.dep }}</span><span style="font-size:12px;color:#736E66">{{ r.from }}</span></span>
                <span style="flex:1;min-width:24px;height:1px;background:#D3CCBF"></span>
                <span style="display:flex;flex-direction:column"><span>{{ r.arr }}</span><span style="font-size:12px;color:#736E66">{{ r.to }}</span></span>
              </div>
              <div style="display:flex;flex-direction:column;gap:3px">
                <span style="font-size:14px">{{ r.duration }}</span>
                <span style="font-size:13px;color:{{ r.stopColor }}">{{ r.stops }}</span>
              </div>
              <div style="display:flex;align-items:center;justify-content:flex-end;gap:14px">
                <span style="display:flex;flex-direction:column;align-items:flex-end"><span style="font-family:'Manrope',sans-serif;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px">{{ r.priceLabel }}</span><span style="font-size:12px;color:#736E66;white-space:nowrap">A/R par pers.</span></span>
                <button onClick="{{ r.add }}" style="cursor:pointer;font-size:13px;font-weight:600;padding:9px 12px;border-radius:999px;white-space:nowrap;border:1px solid {{ r.btnBorder }};background:{{ r.btnBg }};color:{{ r.btnFg }}">{{ r.btnLabel }}</button>
              </div>
            </div>
          </sc-for>
        </div>
        <span style="font-size:13px;color:#736E66">Prix Amadeus en euros, taxes incluses. La réservation se fait chez la compagnie.</span>
      </div>
    </div>
  </div>
  <dc-import name="SiteFooter" hint-size="100%,560px"></dc-import>
  <dc-import name="ChatDock" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { from: "Paris (CDG, ORY)", to: "Lisbonne (LIS)", out: "Sam. 12 avr.", back: "Sam. 19 avr.", pax: "2 adultes", stops: "all", sort: "best", off: {}, added: {} };
  data = [
    { id: 1, airline: "TAP Air Portugal", number: "TP 433", dep: "07:10", arr: "08:55", from: "ORY", to: "LIS", min: 165, stops: 0, price: 148 },
    { id: 2, airline: "easyJet", number: "U2 4651", dep: "06:25", arr: "08:15", from: "ORY", to: "LIS", min: 170, stops: 0, price: 96 },
    { id: 3, airline: "Air France", number: "AF 1024", dep: "09:40", arr: "11:25", from: "CDG", to: "LIS", min: 165, stops: 0, price: 182 },
    { id: 4, airline: "Transavia", number: "TO 3600", dep: "13:05", arr: "14:55", from: "ORY", to: "LIS", min: 170, stops: 0, price: 112 },
    { id: 5, airline: "TAP Air Portugal", number: "TP 439", dep: "18:30", arr: "20:15", from: "CDG", to: "LIS", min: 165, stops: 0, price: 164 },
    { id: 6, airline: "Iberia", number: "IB 3443", dep: "08:15", arr: "13:40", from: "CDG", to: "LIS", min: 385, stops: 1, via: "MAD", price: 128 },
    { id: 7, airline: "easyJet", number: "U2 4655", dep: "20:50", arr: "22:40", from: "CDG", to: "LIS", min: 170, stops: 0, price: 104 },
  ];
  renderVals() {
    const S = this.state;
    const eur = n => n.toLocaleString("fr-FR") + " €";
    const fmt = m => `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}`;
    const names = [...new Set(this.data.map(d => d.airline))];
    let rows = this.data.filter(d => !S.off[d.airline]).filter(d => S.stops === "all" || (S.stops === "direct" ? d.stops === 0 : d.stops > 0));
    const score = d => d.price + d.min * 0.4;
    rows = [...rows].sort((a, b) => S.sort === "cheap" ? a.price - b.price : S.sort === "fast" ? a.min - b.min : score(a) - score(b));
    const field = (label, key) => ({ label, value: S[key], set: e => this.setState({ [key]: e.target.value }) });
    return {
      fields: [field("Départ", "from"), field("Destination", "to"), field("Aller", "out"), field("Retour", "back"), field("Voyageurs", "pax")],
      search: e => e.preventDefault(),
      stopOpts: [["all", "Toutes"], ["direct", "Direct uniquement"], ["one", "1 escale"]].map(([v, label]) => ({ label, ring: S.stops === v ? "#9A7A34" : "#D3CCBF", dot: S.stops === v ? "#9A7A34" : "transparent", pick: () => this.setState({ stops: v }) })),
      airlines: names.map(n => { const on = !S.off[n]; return { label: n, ring: on ? "#9A7A34" : "#D3CCBF", fill: on ? "#9A7A34" : "transparent", check: on ? "✓" : "", toggle: () => this.setState(s => ({ off: { ...s.off, [n]: on } })) }; }),
      sorts: [["best", "Recommandé"], ["cheap", "Moins cher"], ["fast", "Plus rapide"]].map(([v, label]) => ({ label, bg: S.sort === v ? "#0F1B2D" : "transparent", fg: S.sort === v ? "#F9F8F6" : "#4D4943", pick: () => this.setState({ sort: v }) })),
      summary: `${rows.length} vols · ${S.from.split(" (")[0]} → ${S.to.split(" (")[0]} · ${S.out} – ${S.back}`,
      results: rows.map(d => {
        const added = !!S.added[d.id];
        return {
          ...d, duration: fmt(d.min), stops: d.stops ? `1 escale · ${d.via}` : "Direct", stopColor: d.stops ? "#4D4943" : "#2E7650", priceLabel: eur(d.price),
          btnLabel: added ? "Ajouté ✓" : "Ajouter au voyage", btnBg: added ? "transparent" : "#0F1B2D", btnFg: added ? "#0F1B2D" : "#F9F8F6", btnBorder: "#0F1B2D",
          add: () => this.setState(s => ({ added: { ...s.added, [d.id]: !added } })),
        };
      }),
    };
  }
}
</script>
</body>
</html>
