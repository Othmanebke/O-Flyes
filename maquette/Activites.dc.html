<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,500;1,6..72,600&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F9F8F6;color:#0F1B2D;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#9A7A34}a:hover{color:#6E5323}input,button{font-family:inherit}::placeholder{color:#736E66}h1,h2,h3,h4,h5,h6{font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:-0.035em}</style>
<script src="image-slot.js"></script>
<script src="data.js"></script>
</helmet>
<div style="min-height:100vh;background:#F9F8F6">
  <dc-import name="SiteNav" active="activites" style="position:sticky;top:0;z-index:50" hint-size="100%,72px"></dc-import>
  <div data-role="page-banner" style="max-width:1240px;margin:16px auto 0;padding:0 24px"><div style="height:clamp(160px,24vw,280px);border-radius:28px;overflow:hidden"><dc-import name="AivanaVisual" photo="rafting" bare="{{ true }}" w="2000" style="width:100%;height:100%" hint-size="100%,100%"></dc-import></div></div>
  <div data-screen-label="Activités" style="max-width:1200px;margin:0 auto;padding:48px 24px 96px;display:flex;flex-direction:column;gap:28px">
    <h1 style="margin:0;font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:-0.035em;font-size:clamp(36px,4.6vw,56px);line-height:1.05">Quoi <em style="font-family:'Newsreader',serif;font-style:italic;font-weight:500;letter-spacing:-0.02em">faire</em> sur place</h1>

    <form onSubmit="{{ search }}" style="display:flex;gap:8px;background:#FFFDF9;border:1px solid #D3CCBF;border-radius:22px;padding:6px;max-width:720px">
      <input value="{{ q }}" onChange="{{ setQ }}" placeholder="Une ville, une activité…" style="flex:1;min-width:0;background:transparent;border:none;outline:none;color:#0F1B2D;font-size:15px;padding:0 10px;height:44px">
      <button type="submit" style="cursor:pointer;border:none;background:#0F1B2D;color:#F9F8F6;font-weight:600;font-size:14px;padding:0 18px;border-radius:999px" style-hover="background:#1E2E47">Rechercher</button>
    </form>

    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="7">
        <button onClick="{{ c.pick }}" style="cursor:pointer;white-space:nowrap;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }}">{{ c.label }}</button>
      </sc-for>
    </div>

    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:14px;color:#4D4943;border-bottom:1px solid #E4DFD5;padding-bottom:14px">
      <span>{{ summary }}</span>
      <span style="color:#736E66">Source : OpenTripMap</span>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 24px">
      <sc-for list="{{ results }}" as="r" hint-placeholder-count="6">
        <div style="display:flex;flex-direction:column;gap:12px">
          <div style="aspect-ratio:16/10;border-radius:20px;overflow:hidden;border:1px solid #E4DFD5">
            <dc-import name="AivanaVisual" label="{{ r.cat }}" title="{{ r.name }}" subtitle="{{ r.place }}" style="width:100%;height:100%" hint-size="100%,100%"></dc-import>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
            <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
              <span style="font-size:13px;color:#736E66">{{ r.meta }}</span>
              <span style="font-family:'Manrope',sans-serif;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px">{{ r.price }}</span>
            </div>
            <button onClick="{{ r.add }}" style="cursor:pointer;font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;white-space:nowrap;border:1px solid {{ r.btnBorder }};background:transparent;color:{{ r.btnFg }}" style-hover="border-color:#9A7A34">{{ r.btnLabel }}</button>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  <dc-import name="SiteFooter" hint-size="100%,560px"></dc-import>
  <dc-import name="ChatDock" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { q: "Lisbonne", cat: "Toutes", added: {} };
  data = [
    { id: 1, name: "Tram 28 et Alfama à pied", place: "Alfama", cat: "Culture", dur: "3 h", rating: "4,8", price: "25 €" },
    { id: 2, name: "Tour des marchés et pastéis", place: "Time Out Market", cat: "Gastronomie", dur: "3 h", rating: "4,9", price: "55 €" },
    { id: 3, name: "Monastère des Hiéronymites", place: "Belém", cat: "Histoire", dur: "2 h", rating: "4,7", price: "12 €" },
    { id: 4, name: "Surf à Costa da Caparica", place: "Caparica", cat: "Plage", dur: "Demi-journée", rating: "4,8", price: "45 €" },
    { id: 5, name: "Journée à Sintra", place: "Sintra", cat: "Nature", dur: "Journée", rating: "4,9", price: "68 €" },
    { id: 6, name: "Soirée fado", place: "Mouraria", cat: "Culture", dur: "2 h", rating: "4,6", price: "38 €" },
    { id: 7, name: "Coucher de soleil sur le Tage", place: "Cais do Sodré", cat: "Plage", dur: "2 h", rating: "4,7", price: "50 €" },
    { id: 8, name: "Cours de cuisine portugaise", place: "Príncipe Real", cat: "Gastronomie", dur: "4 h", rating: "4,9", price: "75 €" },
  ];
  renderVals() {
    const S = this.state;
    const chip = on => on ? { bg: "#0F1B2D", fg: "#F9F8F6", border: "#0F1B2D" } : { bg: "transparent", fg: "#4D4943", border: "#D3CCBF" };
    const rows = this.data.filter(d => S.cat === "Toutes" || d.cat === S.cat);
    return {
      q: S.q, setQ: e => this.setState({ q: e.target.value }), search: e => e.preventDefault(),
      cats: ["Toutes", "Culture", "Gastronomie", "Histoire", "Plage", "Nature"].map(label => ({ label, ...chip(S.cat === label), pick: () => this.setState({ cat: label }) })),
      summary: `${rows.length} activités à ${S.q}`,
      results: rows.map(d => {
        const added = !!S.added[d.id];
        return { ...d, meta: `${d.dur} · ${d.rating}/5`, price: `${d.price} / pers.`, btnLabel: added ? "Ajouté ✓" : "Ajouter", btnFg: added ? "#9A7A34" : "#0F1B2D", btnBorder: added ? "#9A7A34" : "#D3CCBF", add: () => this.setState(s => ({ added: { ...s.added, [d.id]: !added } })) };
      }),
    };
  }
}
</script>
</body>
</html>
