<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="data.js"></script>
<script src="image-slot.js"></script>
</helmet>
<div style="position:relative;width:100%;height:100%;min-height:120px;container-type:inline-size;background:#D9D2C4;border-radius:inherit;overflow:hidden;color:#4D4943">
  <sc-if value="{{ noPhoto }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0"><image-slot id="{{ slotId }}" shape="rect" placeholder="{{ caption }}"></image-slot></div>
  </sc-if>
  <sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ false }}">
    <img src="{{ src }}" alt="{{ caption }}" loading="lazy" onError="{{ onErr }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block">
  </sc-if>
  <sc-if value="{{ showText }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top, rgba(18,16,12,0.72) 0%, rgba(18,16,12,0.2) 45%, rgba(18,16,12,0) 70%)"></div>
    <div style="position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:14px 16px">
      <div style="display:flex"><span style="font-size:12px;font-weight:600;letter-spacing:0.04em;color:#0F1B2D;background:rgba(255,253,249,0.9);padding:4px 10px;border-radius:999px">{{ label }}</span></div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:-0.03em;font-size:clamp(18px, 8cqw, 44px);line-height:1.05;color:#FFFFFF;text-wrap:balance">{{ title }}</span>
        <span style="font-size:13px;color:rgba(255,255,255,0.88)">{{ subtitle }}</span>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:220},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;LIS&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lisbonne&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Portugal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;photo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bare&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;slot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1000,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { err: false, ready: !!window.AIVANA_PHOTOS };
  componentDidMount() { if (!this.state.ready) this.t = setInterval(() => { if (window.AIVANA_PHOTOS) { clearInterval(this.t); this.setState({ ready: true }); } }, 60); }
  componentWillUnmount() { clearInterval(this.t); }
  pickKey() {
    const p = this.props, P = window.AIVANA_PHOTOS;
    if (!P) return "";
    if (p.photo && P.ids[p.photo]) return p.photo;
    if (P.ids[p.label]) return p.label;
    const txt = `${p.label || ""} ${p.title || ""}`.toLowerCase();
    const h = [...txt].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
    const pool = k => k[h % k.length];
    if (/★|étoile|hôtel|hotel|chiado|alfama|baixa|bairro|belém|príncipe|avenida/.test(txt)) return pool(["hotel1", "hotel2", "hotel3", "hotel4"]);
    if (/gastro|food|cuisine|dégust|marché|vin/.test(txt)) return pool(["food", "market"]);
    if (/plage|mer|surf|kayak|plongée|bateau|eau/.test(txt)) return pool(["paddle", "dive", "boat"]);
    if (/nature|rando|montagne|parc|trek/.test(txt)) return pool(["hike", "meadow", "lake"]);
    if (/aventure|sport|raft|parapente/.test(txt)) return pool(["rafting", "backpack"]);
    if (/culture|musée|visite|histoire|quartier|monument/.test(txt)) return pool(["alley", "market", "balloons"]);
    return pool(["road", "lake", "backpack", "boat", "meadow"]);
  }
  renderVals() {
    const p = this.props, P = window.AIVANA_PHOTOS;
    const page = (window.location.pathname.split("/").pop() || "page").replace(".dc.html", "");
    const slug = s => String(s || "").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const key = this.pickKey();
    const hasPhoto = !!key && !this.state.err;
    return {
      label: p.label, title: p.title, subtitle: p.subtitle, showText: !p.bare,
      hasPhoto, noPhoto: !hasPhoto && this.state.ready,
      src: key && P ? P.url(key, Number(p.w) || 1000) : "",
      onErr: () => this.setState({ err: true }),
      slotId: p.slot || `${slug(page)}-${slug(p.label)}-${slug(p.title)}`,
      caption: `${p.title || p.label || "Photo"}`,
    };
  }
}
</script>
</body>
</html>
