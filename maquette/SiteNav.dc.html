<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,500;1,6..72,600&family=Kaushan+Script&display=swap" rel="stylesheet">
<script src="data.js"></script>
</helmet>
<nav style="font-family:'Manrope',system-ui,sans-serif;padding:{{ pad }};background:{{ barBg }};backdrop-filter:{{ blur }};-webkit-backdrop-filter:{{ blur }};border-bottom:1px solid {{ barLine }}">
  <div style="max-width:1400px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px">
    <button onClick="{{ toggle }}" style="justify-self:start;cursor:pointer;display:flex;align-items:center;gap:12px;background:transparent;border:none;padding:0;color:{{ fg }};font-size:15px;font-weight:700">
      <span style="width:{{ btn }};height:{{ btn }};border-radius:50%;background:#FFFFFF;box-shadow:{{ btnShadow }};color:#0F1B2D;display:flex;align-items:center;justify-content:center;font-size:20px"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="display:block"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h10"></path></svg></span>
      <sc-if value="{{ showMenuLabel }}" hint-placeholder-val="{{ true }}"><span>Menu</span></sc-if>
    </button>
    <a href="Accueil.dc.html" style="text-decoration:none;color:{{ fg }}" style-hover="color:{{ fg }}"><span style="position:relative;display:inline-block;font-family:'Kaushan Script',cursive;font-size:{{ logoSize }};line-height:1;color:{{ fg }};padding:0 14px 6px 0">Aivana<span style="position:absolute;right:-6px;top:-8px;font-size:18px;color:#C9A24B;transform:rotate(-30deg)"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg></span><span style="position:absolute;left:8%;right:18%;bottom:0;height:2px;border-radius:2px;background:#C9A24B;transform:rotate(-2deg)"></span></span></a>
    <div style="justify-self:end;display:flex;align-items:center;gap:10px">
      <sc-if value="{{ showPlanLabel }}" hint-placeholder-val="{{ true }}">
        <a href="Connexion.dc.html" style="font-size:15px;font-weight:700;color:{{ fg }};text-decoration:none;padding:0 18px;height:{{ arrowBox }};display:flex;align-items:center;border-radius:999px;border:1px solid {{ pillLine }}" style-hover="color:{{ fg }};background:{{ pillHover }}">Connexion</a>
      </sc-if>
      <button onClick="{{ plan }}" style="cursor:pointer;display:flex;align-items:center;gap:14px;background:#FFFFFF;border:none;color:#0F1B2D;font-size:15px;font-weight:700;letter-spacing:-0.01em;padding:5px 5px 5px {{ planPad }};border-radius:999px;box-shadow:{{ btnShadow }}" style-hover="background:#FBF6EA">
        <sc-if value="{{ showPlanLabel }}" hint-placeholder-val="{{ true }}"><span>Planifier un voyage</span></sc-if>
        <span style="width:{{ arrowSize }};height:{{ arrowSize }};border-radius:50%;background:#0F1B2D;color:#C9A24B;display:flex;align-items:center;justify-content:center;font-size:18px"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></span>
      </button>
    </div>
  </div>
</nav>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:300;background:#F9F8F6;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));font-family:'Manrope',system-ui,sans-serif;color:#0F1B2D;overflow-y:auto">
    <div style="padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;gap:28px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <button onClick="{{ toggle }}" style="cursor:pointer;display:flex;align-items:center;gap:12px;background:transparent;border:none;padding:0;color:#0F1B2D;font-size:16px;font-weight:700">
          <span style="width:56px;height:56px;border-radius:50%;background:#0F1B2D;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:22px"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:0 0 auto"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span>Fermer
        </button>
        <span style="position:relative;display:inline-block;font-family:'Kaushan Script',cursive;font-size:30px;line-height:1;color:#0F1B2D;padding:0 14px 6px 0">Aivana<span style="position:absolute;right:-6px;top:-8px;font-size:15px;color:#C9A24B;transform:rotate(-30deg)"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg></span><span style="position:absolute;left:8%;right:18%;bottom:0;height:2px;border-radius:2px;background:#C9A24B;transform:rotate(-2deg)"></span></span>
      </div>
      <div style="display:flex;flex-direction:column;margin-top:auto">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="8">
          <a href="{{ l.href }}" style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px dashed #D3CCBF;text-decoration:none;color:#0F1B2D" style-hover="color:#9A7A34">
            <span style="font-size:clamp(28px,4vw,48px);font-weight:700;letter-spacing:-0.04em;line-height:1.05">{{ l.label }}</span>
            <span style="font-family:'Newsreader',serif;font-style:italic;font-size:16px;color:#736E66">{{ l.note }}</span>
          </a>
        </sc-for>
      </div>
      <button onClick="{{ plan }}" style="align-self:flex-start;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;color:#FFFFFF;background:#0F1B2D;border:none;padding:6px 6px 6px 22px;border-radius:999px">Demander au copilote<span style="width:38px;height:38px;border-radius:50%;background:#F1E3C2;color:#0F1B2D;display:flex;align-items:center;justify-content:center"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:0 0 auto"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></span></button>
    </div>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <div style="position:relative;margin:16px;border-radius:28px;overflow:hidden;background:#2A2620;min-height:300px">
        <img src="{{ menuImg }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
        <div style="position:absolute;left:24px;right:24px;bottom:24px;color:#FFFFFF;display:flex;flex-direction:column;gap:6px">
          <span style="font-family:'Newsreader',serif;font-style:italic;font-size:26px">Où partez-vous ensuite ?</span>
          <span style="font-size:15px;color:rgba(255,255,255,0.85)">22 destinations, de 650 € à deux.</span>
        </div>
      </div>
    </sc-if>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:110},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;destinations&quot;,&quot;vols&quot;,&quot;hotels&quot;,&quot;activites&quot;,&quot;journal&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;solid&quot;,&quot;overlay&quot;],&quot;default&quot;:&quot;solid&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth, open: false };
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener("resize", this.onR); }
  componentWillUnmount() { window.removeEventListener("resize", this.onR); }
  renderVals() {
    const P = window.AIVANA_PHOTOS;
    const over = this.props.variant === "overlay";
    const small = this.state.w < 640;
    const links = [
      ["Accueil", "Accueil.dc.html", "Le point de départ"], ["Destinations", "Destinations.dc.html", "22 idées"], ["Vols", "Vols.dc.html", "Depuis Paris"],
      ["Hôtels", "Hotels.dc.html", "Prix par nuit"], ["Activités", "Activites.dc.html", "Sur place"], ["Journal", "Journal.dc.html", "Récits"],
      ["Mes voyages", "Dashboard.dc.html", "Votre carnet"], ["Tarifs", "Tarifs.dc.html", "Gratuit ou Pro"], ["Connexion", "Connexion.dc.html", "Ou créer un compte"],
    ].map(([label, href, note]) => ({ label, href, note }));
    return {
      links, open: this.state.open, desktop: this.state.w >= 980, mobile: this.state.w < 980,
      navLinks: links.slice(1, 6).map(l => ({ ...l, color: l.href.toLowerCase().startsWith(this.props.active || "§") ? (over ? "#FFFFFF" : "#0F1B2D") : (over ? "rgba(255,255,255,0.82)" : "#4D4943") })),
      markBg: over ? "rgba(255,255,255,0.14)" : "#0F1B2D",
      menuImg: P ? P.url("balloons", 1200) : "",
      pad: over ? (small ? "16px 16px" : "28px 36px") : (small ? "10px 16px" : "12px 32px"),
      barBg: over ? "transparent" : "rgba(249,248,246,0.82)", blur: over ? "none" : "saturate(180%) blur(18px)", barLine: over ? "transparent" : "rgba(211,204,191,0.6)",
      fg: over ? "#FFFFFF" : "#0F1B2D",
      btn: small ? "46px" : (over ? "60px" : "50px"), btnShadow: over ? "none" : "0 0 0 1px #E4DFD5",
      logoSize: small ? "30px" : (over ? "44px" : "36px"),
      showMenuLabel: !small, showPlanLabel: this.state.w >= 860, pillLine: over ? "rgba(255,255,255,0.55)" : "#D3CCBF", pillHover: over ? "rgba(255,255,255,0.12)" : "#FFFFFF", arrowBox: over ? "60px" : "52px", planPad: this.state.w < 860 ? "5px" : "26px", arrowSize: small ? "38px" : (over ? "50px" : "42px"),
      toggle: () => this.setState(s => ({ open: !s.open })),
      plan: () => { this.setState({ open: false }); if (window.__aivanaDock) window.dispatchEvent(new CustomEvent("aivana-ask", { detail: "" })); else window.location.href = "Assistant.dc.html"; },
    };
  }
}
</script>
</body>
</html>
