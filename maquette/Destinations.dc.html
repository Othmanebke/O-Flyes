<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,500;1,6..72,600&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F9F8F6;color:#0F1B2D;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#9A7A34}a:hover{color:#6E5323}input,button,select{font-family:inherit}::placeholder{color:#736E66}h1,h2,h3,h4,h5,h6{font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:-0.035em}</style>
<script src="data.js"></script>
<script src="image-slot.js"></script>
</helmet>
<div style="min-height:100vh;background:#F9F8F6">
  <dc-import name="SiteNav" active="destinations" style="position:sticky;top:0;z-index:50" hint-size="100%,72px"></dc-import>
  <div data-role="page-banner" style="max-width:1240px;margin:16px auto 0;padding:0 24px"><div style="height:clamp(160px,24vw,280px);border-radius:28px;overflow:hidden"><dc-import name="AivanaVisual" photo="lake" bare="{{ true }}" w="2000" style="width:100%;height:100%" hint-size="100%,100%"></dc-import></div></div>
  <div data-screen-label="Destinations" style="max-width:1200px;margin:0 auto;padding:48px 24px 96px;display:flex;flex-direction:column;gap:32px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <h1 style="margin:0;font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:-0.035em;font-size:clamp(36px,4.6vw,56px);line-height:1.05">Où <em style="font-family:'Newsreader',serif;font-style:italic;font-weight:500;letter-spacing:-0.02em">partir</em> ensuite ?</h1>
      <p style="margin:0;font-size:16px;color:#4D4943;max-width:560px">Budgets estimés pour deux voyageurs, vols depuis Paris compris. Filtrez par budget, région ou mois de départ.</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;padding:18px 0;border-top:1px solid #E4DFD5;border-bottom:1px solid #E4DFD5">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
        <span style="font-size:13px;color:#736E66;width:72px">Budget</span>
        <sc-for list="{{ tiers }}" as="t" hint-placeholder-count="5">
          <button onClick="{{ t.pick }}" style="cursor:pointer;white-space:nowrap;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }}">{{ t.label }} <span style="color:#736E66">{{ t.range }}</span></button>
        </sc-for>
      </div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
        <span style="font-size:13px;color:#736E66;width:72px">Région</span>
        <sc-for list="{{ continents }}" as="t" hint-placeholder-count="6">
          <button onClick="{{ t.pick }}" style="cursor:pointer;white-space:nowrap;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }}">{{ t.label }}</button>
        </sc-for>
      </div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
        <span style="font-size:13px;color:#736E66;width:72px">Départ en</span>
        <select value="{{ month }}" onChange="{{ setMonth }}" style="height:34px;background:#FFFDF9;border:1px solid #D3CCBF;border-radius:999px;color:#0F1B2D;font-size:13px;padding:0 10px">
          <sc-for list="{{ months }}" as="m" hint-placeholder-count="13">
            <option value="{{ m.v }}">{{ m.label }}</option>
          </sc-for>
        </select>
        <div style="flex:1"></div>
        <span style="font-size:13px;color:#736E66">{{ countLabel }}</span>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px 20px">
      <sc-for list="{{ results }}" as="d" hint-placeholder-count="8">
        <a href="Destination.dc.html?id={{ d.id }}" style="display:flex;flex-direction:column;gap:12px;text-decoration:none;color:#0F1B2D">
          <div style="aspect-ratio:4/3;border-radius:20px;overflow:hidden;border:1px solid #E4DFD5">
            <dc-import name="AivanaVisual" label="{{ d.code }}" title="{{ d.name }}" subtitle="{{ d.country }}" style="width:100%;height:100%" hint-size="100%,100%"></dc-import>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px">
            <div style="display:flex;justify-content:space-between;gap:12px;font-size:14px">
              <span style="font-weight:600">{{ d.tier }}</span>
              <span style="font-family:'Manrope',sans-serif;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap">{{ d.budgetLabel }}</span>
            </div>
            <span style="font-size:13px;color:#736E66">{{ d.meta }}</span>
          </div>
        </a>
      </sc-for>
    </div>
    <sc-if value="{{ none }}" hint-placeholder-val="{{ false }}">
      <div style="border:1px dashed #D3CCBF;border-radius:22px;padding:32px;display:flex;flex-direction:column;gap:10px;align-items:flex-start">
        <span style="font-size:16px;font-weight:600">Aucune destination pour ces filtres</span>
        <button onClick="{{ clear }}" style="cursor:pointer;background:transparent;border:1px solid #D3CCBF;color:#0F1B2D;font-size:14px;padding:9px 14px;border-radius:999px">Réinitialiser les filtres</button>
      </div>
    </sc-if>
  </div>
  <dc-import name="SiteFooter" hint-size="100%,560px"></dc-import>
  <dc-import name="ChatDock" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tier: "Tous", cont: "Toutes", month: "", ready: !!window.AIVANA_DATA };
  componentDidMount() { if (!this.state.ready) this.t = setInterval(() => { if (window.AIVANA_DATA) { clearInterval(this.t); this.setState({ ready: true }); } }, 50); }
  componentWillUnmount() { clearInterval(this.t); }
  chip(active) { return active ? { bg: "#0F1B2D", fg: "#F9F8F6", border: "#0F1B2D" } : { bg: "transparent", fg: "#4D4943", border: "#D3CCBF" }; }
  renderVals() {
    const A = window.AIVANA_DATA;
    const { tier, cont, month } = this.state;
    const tiers = [["Tous", ""], ["Essentiel", "< 1 500 €"], ["Confort", "1 500 – 3 500 €"], ["Premium", "3 500 – 6 000 €"], ["Prestige", "6 000 € +"]]
      .map(([label, range]) => ({ label, range, ...this.chip(tier === label), pick: () => this.setState({ tier: label }) }));
    const continents = ["Toutes", "Europe", "Afrique", "Asie", "Amérique", "Océanie"].map(label => ({ label, ...this.chip(cont === label), pick: () => this.setState({ cont: label }) }));
    const months = [{ v: "", label: "N'importe quand" }, ...["Jan", "Fév", "Mars", "Avr", "Mai", "Juin", "Juil", "Août", "Sept", "Oct", "Nov", "Déc"].map(m => ({ v: m, label: m }))];
    const results = (A ? A.destinations : [])
      .filter(d => tier === "Tous" || d.tier === tier)
      .filter(d => cont === "Toutes" || d.continent === cont)
      .filter(d => !month || d.months.includes(month))
      .map(d => ({ ...d, budgetLabel: `${A.eur(d.budgetMin)} – ${A.eur(d.budgetMax)}`, meta: `${d.duration} · idéal ${d.months.slice(0, 3).join(", ")}` }));
    return {
      tiers, continents, months, month, results,
      setMonth: e => this.setState({ month: e.target.value }),
      countLabel: `${results.length} destination${results.length > 1 ? "s" : ""}`,
      none: !!A && results.length === 0,
      clear: () => this.setState({ tier: "Tous", cont: "Toutes", month: "" }),
    };
  }
}
</script>
</body>
</html>
