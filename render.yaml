databases:
  - name: "oflyes-db-instance"
    plan: "free"
    databaseName: "oflyes_db"
    user: "oflyes"

services:

  # ── API Gateway (Public) ──────────────────────────────────────────────────
  - type: "web"
    name: "api-gateway"
    plan: "free"
    env: "docker"
    dockerContext: "services/gateway"
    dockerfilePath: "services/gateway/Dockerfile"
    envVars:
      - key: "PORT"
        value: "3000"
      - key: "AUTH_SERVICE_URL"
        value: "https://auth-service-8x7w.onrender.com"
      - key: "DB_SERVICE_URL"
        value: "https://database-service-uybo.onrender.com"
      - key: "AI_SERVICE_URL"
        value: "https://ai-service-qfvv.onrender.com"
      - key: "TRAVEL_ENGINE_URL"
        value: "https://travel-engine-7tk8.onrender.com"
      - key: "NOTIF_SERVICE_URL"
        value: "https://notifications-service-a7f6.onrender.com"
      - key: "PARTNER_SERVICE_URL"
        value: "https://partner-service-wixv.onrender.com"
      - key: "METRICS_SERVICE_URL"
        value: "http://metrics-service:3009"
      - key: "NODE_ENV"
        value: "production"

  # ── Travel Engine Service ────────────────────────────────────────────────
  - type: "web"
    name: "travel-engine"
    plan: "free"
    env: "docker"
    dockerContext: "services/travel-engine"
    dockerfilePath: "services/travel-engine/Dockerfile"
    envVars:
      - key: "PORT"
        value: "3005"
      - key: "NODE_ENV"
        value: "production"

  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: "redis"
    name: "oflyes-redis-instance"
    plan: "free"
    ipAllowList: []

  # ── Database Service ────────────────────────────────────────────────────────
  - type: "web"
    name: "database-service"
    plan: "free"
    env: "docker"
    dockerContext: "services/database"
    dockerfilePath: "services/database/Dockerfile"
    envVars:
      - key: "PORT"
        value: "3002"
      - key: "DB_PORT"
        value: "3002"
      - key: "DATABASE_URL"
        value: "postgresql://oflyes:R5WjzwxqPs35QBIdlLnaGAev1QnUALro@dpg-d6egaig8tnhs738m6mkg-a/oflyes_db"

  # ── Auth Service ───────────────────────────────────────────────────────────
  - type: "web"
    name: "auth-service"
    plan: "free"
    env: "docker"
    dockerContext: "services/auth"
    dockerfilePath: "services/auth/Dockerfile"
    envVars:
      - key: "PORT"
        value: "3001"
      - key: "AUTH_PORT"
        value: "3001"
      - key: "REDIS_URL"
        value: "redis://red-d6egai88tnhs738m6mig:6379"
      - key: "DB_URL"
        value: "https://database-service-uybo.onrender.com"
      - key: "AUTH_SERVICE_URL"
        value: "https://api-gateway-v0vr.onrender.com/api"
      - key: "FRONTEND_URL"
        value: "https://aivanaflyes.vercel.app"
      - key: "JWT_SECRET"
        value: "oflyes_production_secret_2026"
      - key: "OAUTH_GOOGLE_CLIENT_ID"
        value: "TO_BE_REPLACED_IN_RENDER_DASHBOARD"
      - key: "OAUTH_GOOGLE_CLIENT_SECRET"
