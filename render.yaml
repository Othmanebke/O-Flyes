databases:
  - name: oflyes-db-instance
    plan: free
    databaseName: oflyes_db
    user: oflyes

services:

  # ── API Gateway (Public) ──────────────────────────────────────────────────
  - type: web
    name: api-gateway
    plan: free
    env: docker
    dockerContext: services/gateway
    dockerfilePath: services/gateway/Dockerfile
    envVars:
      - key: PORT
        value: 3000
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
      - key: DB_SERVICE_URL
        value: http://database-service:3002
      - key: AI_SERVICE_URL
        value: http://ai-service:3003
      - key: NODE_ENV
        value: production

  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: oflyes-redis-instance
    plan: free
    ipAllowList: [] # Only allow access from within Render

  # ── Database Service ────────────────────────────────────────────────────────
  - type: web
    name: database-service
    plan: free
    env: docker
    dockerContext: services/database
    dockerfilePath: services/database/Dockerfile
    envVars:
      - key: PORT
        value: 3002
      - key: DB_PORT
        value: 3002
      - key: DATABASE_URL
        value: postgresql://oflyes:R5WjzwxqPs35QBIdlLnaGAev1QnUALro@dpg-d6egaig8tnhs738m6mkg-a/oflyes_db

  # ── Auth Service ───────────────────────────────────────────────────────────
  - type: web
    name: auth-service
    plan: free
    env: docker
    dockerContext: services/auth
    dockerfilePath: services/auth/Dockerfile
    envVars:
      - key: PORT
        value: 3001
      - key: AUTH_PORT
        value: 3001
      - key: REDIS_URL
        value: redis://red-d6egai88tnhs738m6mig:6379
      - key: NEXT_PUBLIC_API_DB
        value: http://database-service:3002
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  # ── AI Service ─────────────────────────────────────────────────────────────
  - type: web
    name: ai-service
    plan: free
    env: docker
    dockerContext: services/ai
    dockerfilePath: services/ai/Dockerfile
    envVars:
      - key: PORT
        value: 3003
      - key: AI_PORT
        value: 3003
      - key: NEXT_PUBLIC_API_DB
        value: http://database-service:3002
      - key: GROQ_API_KEY
        value: "TO_BE_REPLACED_IN_RENDER_DASHBOARD"

  # ── Sync Worker Service ──────────────────────────────────────────────────
  - type: web
    name: sync-worker
    plan: free
    env: docker
    dockerContext: services/sync-worker
    dockerfilePath: services/sync-worker/Dockerfile
    envVars:
      - key: PORT
        value: 3004
      - key: SYNC_PORT
        value: 3004
      - key: NEXT_PUBLIC_API_DB
        value: http://database-service:3002
      - key: NEXT_PUBLIC_API_AI
        value: http://ai-service:3003
      - key: OAUTH_GOOGLE_CLIENT_ID
        value: "TO_BE_REPLACED_IN_RENDER_DASHBOARD"
      - key: OAUTH_GOOGLE_CLIENT_SECRET
        value: "TO_BE_REPLACED_IN_RENDER_DASHBOARD"
      - key: OAUTH_CALLBACK_URL
        value: "https://auth-service.onrender.com/auth/callback"

  # ── Partner Service ────────────────────────────────────────────────────────
  - type: web
    name: partner-service
    plan: free
    env: docker
    dockerContext: services/partner-service
    dockerfilePath: services/partner-service/Dockerfile
    envVars:
      - key: PORT
        value: 3005
      - key: PARTNER_PORT
        value: 3005
