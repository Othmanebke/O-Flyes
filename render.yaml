      - key: "NODE_ENV"
        value: "production"

  # ── AI Service ─────────────────────────────────────────────────────────────
  - type: "web"
    name: "ai-service"
    plan: "free"
    env: "docker"
    dockerContext: "services/ai"
    dockerfilePath: "services/ai/Dockerfile"
    envVars:
      - key: "PORT"
        value: "3003"
      - key: "AI_PORT"
        value: "3003"
      - key: "DB_URL"
        value: "https://database-service-uybo.onrender.com"
