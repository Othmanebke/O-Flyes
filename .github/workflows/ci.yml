# Intégration continue : à chaque push et pull request, le code est vérifié
# automatiquement (types, règles de code, formatage, tests, build de production).
name: CI

on:
  push:
    branches: [main, refonte-ui]
  pull_request:

jobs:
  verifier:
    name: Vérifier le code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Types (TypeScript)
        run: npm run typecheck

      - name: Règles de code (ESLint)
        run: npm run lint

      - name: Formatage (Prettier)
        run: npm run format:check

      - name: Tests unitaires (Jest)
        run: npm test

      - name: Audit de sécurité des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Build de production
        run: npm run build
        env:
          # valeurs factices : le build n'appelle pas Supabase
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
